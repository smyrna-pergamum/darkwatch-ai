# docker compose up -d   ->  dashboard on http://127.0.0.1:8000
services:
  tor:
    build: ./docker/tor
    environment:
      TOR_CONTROL_PASSWORD: ${TOR_CONTROL_PASSWORD:-changeme}
    restart: unless-stopped

  ollama:                        # optional local AI (raw content never leaves the box)
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    restart: unless-stopped
    profiles: [ai]

  llamacpp:                      # optional llama.cpp server for GGUF models in ./models
    image: ghcr.io/ggml-org/llama.cpp:server
    command: ["-m", "/models/${GGUF_FILE:-model.gguf}", "--host", "0.0.0.0", "--port", "8080", "-c", "8192", "--jinja"]
    volumes: ["./models:/models:ro"]
    restart: unless-stopped
    profiles: [llamacpp]

  monitor:
    build: .
    env_file: .env
    environment:
      TOR_PROXY_HOST: tor
      TOR_CONTROL_PASSWORD: ${TOR_CONTROL_PASSWORD:-changeme}
      OLLAMA_BASE_URL: http://ollama:11434
      LLAMACPP_BASE_URL: http://llamacpp:8080
      DATABASE_URL: sqlite:////data/monitor.db
      API_KEY: ${API_KEY:?set API_KEY in your shell or .env}
    volumes: [data:/data]
    ports: ["127.0.0.1:8000:8000"]
    depends_on: [tor]
    restart: unless-stopped

volumes:
  data:
  ollama:
