name: Release
on:
  push:
    tags: ["v*"]
  release:
    types: [published]   # also when the release/tag is created in the GitHub web UI

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && pytest -q

  build:
    needs: test
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller
      - run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: dist/*.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Version
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VER=${TAG#v}" >> "$GITHUB_ENV"
      - name: Source archive
        run: git archive --format=zip --prefix=darkweb-monitor-$VER/ -o dist/darkweb-monitor-$VER-src.zip HEAD
      - name: Checksums
        run: cd dist && sha256sum *.zip > SHA256SUMS.txt
      - name: Release notes from CHANGELOG
        run: awk -v v="$VER" '/^## \[/{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: DarkWeb Monitor ${{ env.VER }}
          body_path: notes.md
          make_latest: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
